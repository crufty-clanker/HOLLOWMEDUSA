version: 2
updates:
  # Python backend
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "hollowmedusa-team"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "*dev*"
          - "*test*"
          - "*lint*"
        update-types:
          - "minor"
          - "patch"
      runtime-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Node.js frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "hollowmedusa-team"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "react-dom"
          - "react-router*"
          - "reactflow"
        update-types:
          - "minor"
          - "patch"
      editor-components:
        patterns:
          - "@monaco-editor*"
          - "@tanstack*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "*dev*"
          - "*test*"
          - "*lint*"
        update-types:
          - "minor"
          - "patch"
