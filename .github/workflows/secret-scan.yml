name: Secret Scan

on:
  pull_request:

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Detect secrets
        uses: perryzjc/detect-secrets-action@main
        with:
          baseline: '.secrets.baseline'
